<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema Grand Slam — Conquer Every Festival</title>
    <meta
      name="description"
      content="Cinema Grand Slam — official game: Cinema Siqueiros. Draft a 15-role film crew from the greatest rosters in world cinema and conquer every major festival — Cannes, Venice, Berlin, the Oscars, Sundance and Locarno — within three seasons."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div id="roadmap" class="roadmap" aria-label="Road to the Cinema Grand Slam"></div>
    <main id="app"></main>
    <section class="support-box" aria-label="Support the developer">
      <h3 class="support-title">☕ Support Cinema Grand Slam</h3>
      <p class="support-text">
        If you enjoy the game and would like to support future development,
        consider buying me a coffee.
      </p>
      <a
        class="btn btn-coffee"
        href="https://buymeacoffee.com/cinemagrandslam"
        target="_blank"
        rel="noopener noreferrer"
        >☕ Buy Me a Coffee</a
      >
    </section>
    <footer class="site-foot">
      <span>Cinema Grand Slam — official game: Cinema Siqueiros</span>
    </footer>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
